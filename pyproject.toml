[project]
name = "telegram-sales-bot"
version = "0.1.0"
description = "Telegram bot for automatic sales: cities, products, crypto payments, courier delivery, disputes, reviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "SQLAlchemy>=2.0,<3",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/**" = ["B008"]

[tool.setuptools.packages.find]
include = ["bot*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
